<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- GNOME HIG Felt Green Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e7e44"/>
      <stop offset="50%" stop-color="#145c30"/>
      <stop offset="100%" stop-color="#0c3d1e"/>
    </linearGradient>

    <!-- Top Highlight Rim -->
    <linearGradient id="topRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Contemporary Warm Gold Gradient for Bridge Arch -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="40%" stop-color="#ffc107"/>
      <stop offset="80%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>

    <!-- Card Face Gradient -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Soft Ambient Drop Shadow for Cards (HIG Style) -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#04140a" flood-opacity="0.45"/>
    </filter>

    <!-- Subtle Arch Shadow -->
    <filter id="archShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Bold Crisp Spade Vector -->
    <g id="spade">
      <path d="M 0,-15 C -2.5,-8 -12,-1 -12,5 C -12,10.5 -7.5,13 -2.5,11.5 C -1.8,11.5 -1.2,12.5 -1.8,15 L -4,19 L 4,19 L 1.8,15 C 1.2,12.5 1.8,11.5 2.5,11.5 C 7.5,13 12,10.5 12,5 C 12,-1 2.5,-8 0,-15 Z" fill="#1e293b"/>
    </g>

    <!-- Bold Crisp Heart Vector -->
    <g id="heart">
      <path d="M 0,13 C -2,11.2 -12,3.5 -12,-3 C -12,-8.5 -7.2,-11.5 -2.5,-9.5 C -1,-8.8 0,-7 0,-7 C 0,-7 1,-8.8 2.5,-9.5 C 7.2,-11.5 12,-8.5 12,-3 C 12,3.5 2,11.2 0,13 Z" fill="#dc2626"/>
    </g>
  </defs>

  <!-- BASE TILE: Standard GNOME 112x112 squircle (x=8, y=8, rx=28) -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#bgGradient)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="none" stroke="url(#topRim)" stroke-width="1.5"/>

  <!-- GOLDEN BRIDGE ARCH (Sweeping architectural curve symbolizing 'Bridge') -->
  <g filter="url(#archShadow)">
    <path d="M 22 92 C 40 54, 88 54, 106 92" fill="none" stroke="#7c2d12" stroke-width="7" opacity="0.25"/>
    <path d="M 22 92 C 40 54, 88 54, 106 92" fill="none" stroke="url(#goldGradient)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 18 92 L 110 92" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- PLAYING CARDS FAN (Ace of Spades & Heart) -->
  <!-- Card 1: Left Card - Spade (Rotated -11°) -->
  <g transform="translate(49, 58) rotate(-11)" filter="url(#shadow)">
    <rect x="-21" y="-31" width="42" height="62" rx="5" fill="url(#cardGradient)" stroke="#cbd5e1" stroke-width="0.75"/>
    <use href="#spade" transform="scale(0.95)"/>
  </g>

  <!-- Card 2: Right Card - Heart (Rotated +13°) -->
  <g transform="translate(79, 60) rotate(13)" filter="url(#shadow)">
    <rect x="-21" y="-31" width="42" height="62" rx="5" fill="url(#cardGradient)" stroke="#cbd5e1" stroke-width="0.75"/>
    <use href="#heart" transform="scale(0.95)"/>
  </g>
</svg>
