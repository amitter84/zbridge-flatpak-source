<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- GNOME HIG Top Lighting Gradients -->
    <!-- Base Felt Green Tile Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e6b3c"/>
      <stop offset="50%" stop-color="#14522d"/>
      <stop offset="100%" stop-color="#0b381d"/>
    </linearGradient>

    <!-- Top Edge Rim Highlight (GNOME 40+ standard) -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Contemporary Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="35%" stop-color="#ffc107"/>
      <stop offset="70%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Card Face Gradient -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f7"/>
    </linearGradient>

    <!-- Soft Ambient Shadows for Internal Layering (Allowed by Flathub) -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#051a0d" flood-opacity="0.45"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Bold Simplified Suit Vector Shapes -->
    <g id="spadeShape">
      <path d="M 0,-12 C -2,-7 -10,-1 -10,4 C -10,8.5 -6.5,11 -2,10 C -1.5,10 -1,11 -1.5,13 L -3,16 L 3,16 L 1.5,13 C 1,11 1.5,10 2,10 C 6.5,11 10,8.5 10,4 C 10,-1 2,-7 0,-12 Z" fill="#1e293b"/>
    </g>

    <g id="heartShape">
      <path d="M 0,11 C -1.5,9.5 -10,3 -10,-2.5 C -10,-7 -6,-9.5 -2,-8 C -0.8,-7.5 0,-6 0,-6 C 0,-6 0.8,-7.5 2,-8 C 6,-9.5 10,-7 10,-2.5 C 10,3 1.5,9.5 0,11 Z" fill="#dc2626"/>
    </g>
  </defs>

  <!-- BASE TILE: Standard GNOME 112x112 squircle (x=8, y=8, rx=18) without outer baked-in shadow -->
  <rect x="8" y="8" width="112" height="112" rx="18" ry="18" fill="url(#bgGradient)"/>

  <!-- Base Tile Top Edge Rim Highlight -->
  <rect x="8" y="8" width="112" height="112" rx="18" ry="18" fill="none" stroke="url(#topHighlight)" stroke-width="1.5"/>

  <!-- CLEAN CONTEMPORARY BRIDGE ARCH (Bold geometric curve, no clutter lines) -->
  <g filter="url(#badgeShadow)" opacity="0.9">
    <path d="M 16 94 C 40 66, 88 66, 112 94" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="14" y1="94" x2="114" y2="94" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- PLAYING CARDS FAN (Ace of Spades & King of Hearts) -->
  <!-- Card 1: Ace of Spades (Angled -12°) -->
  <g transform="translate(48, 54) rotate(-12)" filter="url(#cardShadow)">
    <rect x="-22" y="-32" width="44" height="64" rx="4" fill="url(#cardGradient)" stroke="#d1d5db" stroke-width="0.75"/>
    <text x="-16" y="-19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#1e293b">A</text>
    <use href="#spadeShape" transform="translate(-16, -12) scale(0.32)"/>
    <use href="#spadeShape" transform="translate(0, 2) scale(1.1)"/>
  </g>

  <!-- Card 2: King of Hearts (Angled +14°) -->
  <g transform="translate(78, 56) rotate(14)" filter="url(#cardShadow)">
    <rect x="-22" y="-32" width="44" height="64" rx="4" fill="url(#cardGradient)" stroke="#d1d5db" stroke-width="0.75"/>
    <text x="-16" y="-19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#dc2626">K</text>
    <use href="#heartShape" transform="translate(-16, -12) scale(0.32)"/>
    <use href="#heartShape" transform="translate(0, 2) scale(1.1)"/>
  </g>

  <!-- FOREGROUND GOLD EMBLEM ("zB" Insignia) -->
  <g transform="translate(64, 88)" filter="url(#badgeShadow)">
    <circle cx="0" cy="0" r="17" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="1.25"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#b45309" stroke-width="0.8" opacity="0.5"/>
    <text x="-0.5" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="900" fill="#451a03" text-anchor="middle" letter-spacing="-0.5">zB</text>
  </g>
</svg>
