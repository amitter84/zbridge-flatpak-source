<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- 3D Felt Green Tile Gradients & Shadows -->
    <linearGradient id="tileSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#248a4c"/>
      <stop offset="60%" stop-color="#186335"/>
      <stop offset="100%" stop-color="#0f4523"/>
    </linearGradient>

    <linearGradient id="tileBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b3319"/>
      <stop offset="100%" stop-color="#04170b"/>
    </linearGradient>

    <linearGradient id="topHighlightRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Metallic 3D Gold Arch Gradient -->
    <linearGradient id="gold3D" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="25%" stop-color="#ffca28"/>
      <stop offset="65%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#b75100"/>
    </linearGradient>

    <linearGradient id="goldSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- 3D Card Edge & Face Gradients -->
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="cardThickness" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Suit 3D Gradients -->
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Deep Ambient 3D Shadow Filters -->
    <filter id="tileAmbientShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020b05" flood-opacity="0.65"/>
    </filter>

    <filter id="cardShadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#031207" flood-opacity="0.55"/>
    </filter>

    <filter id="archShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Crisp 3D Spade Shape -->
    <g id="spade3D">
      <path d="M 0,-16 C -2.8,-8.5 -13,-1 -13,5.5 C -13,11.5 -8,14 -2.8,12.2 C -2,12.2 -1.3,13.2 -2,16 L -4.5,20.5 L 4.5,20.5 L 2,16 C 1.3,13.2 2,12.2 2.8,12.2 C 8,14 13,11.5 13,5.5 C 13,-1 2.8,-8.5 0,-16 Z" fill="url(#spadeGrad)"/>
      <path d="M 0,-14 C -2,-8 -9,-2 -9,4 C -9,6 -7,8 -3,7 C 0,-4 -1,-10 0,-14 Z" fill="#ffffff" opacity="0.15"/>
    </g>

    <!-- Crisp 3D Heart Shape -->
    <g id="heart3D">
      <path d="M 0,14 C -2.2,12 -13,3.8 -13,-3.2 C -13,-9 -7.8,-12 -2.8,-9.8 C -1.2,-9.1 0,-7.2 0,-7.2 C 0,-7.2 1.2,-9.1 2.8,-9.8 C 7.8,-12 13,-9 13,-3.2 C 13,3.8 2.2,12 0,14 Z" fill="url(#heartGrad)"/>
      <path d="M 0,-5 C 0,-5 1,-7.5 2.3,-8 C 6.5,-9.8 10.5,-7.2 10.5,-2.5 C 10.5,2 -1,8.5 -0.5,2 C 2,2 5,-1 0,-5 Z" fill="#ffffff" opacity="0.2"/>
    </g>
  </defs>

  <!-- 3D BASE TILE: GNOME 112x112 squircle with 3D depth bevel -->
  <g filter="url(#tileAmbientShadow)">
    <rect x="8" y="12" width="112" height="108" rx="28" ry="28" fill="url(#tileBevel)"/>
    <rect x="8" y="8" width="112" height="108" rx="28" ry="28" fill="url(#tileSurface)"/>
    <rect x="8" y="8" width="112" height="108" rx="28" ry="28" fill="none" stroke="url(#topHighlightRim)" stroke-width="1.5"/>
  </g>

  <!-- 3D GOLDEN BRIDGE ARCH STRUCTURE -->
  <g filter="url(#archShadow3D)">
    <path d="M 20 94 C 40 50, 88 50, 108 94" fill="none" stroke="#04150a" stroke-width="9" opacity="0.4"/>
    <path d="M 20 94 C 40 50, 88 50, 108 94" fill="none" stroke="url(#gold3D)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 21 93.5 C 40 50.5, 88 50.5, 107 93.5" fill="none" stroke="url(#goldSpecular)" stroke-width="1.75" stroke-linecap="round"/>
    <path d="M 16 94 L 112 94" stroke="url(#gold3D)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- 3D PLAYING CARDS WITH PHYSICAL THICKNESS -->
  <!-- Card 1: Ace of Spades (Left, tilted -12°) -->
  <g transform="translate(48, 55) rotate(-12)" filter="url(#cardShadow3D)">
    <rect x="-20.5" y="-30.5" width="43" height="63" rx="5.5" fill="url(#cardThickness)"/>
    <rect x="-22" y="-32" width="44" height="64" rx="5" fill="url(#cardFront)" stroke="#cbd5e1" stroke-width="0.75"/>
    <use href="#spade3D" transform="scale(0.92)"/>
  </g>

  <!-- Card 2: Ace of Hearts (Right, tilted +14°, overlapping) -->
  <g transform="translate(79, 58) rotate(14)" filter="url(#cardShadow3D)">
    <rect x="-20.5" y="-30.5" width="43" height="63" rx="5.5" fill="url(#cardThickness)"/>
    <rect x="-22" y="-32" width="44" height="64" rx="5" fill="url(#cardFront)" stroke="#cbd5e1" stroke-width="0.75"/>
    <use href="#heart3D" transform="scale(0.92)"/>
  </g>
</svg>
